<div class="shell">
  @if (!authLayout()) {
    <header class="header" [class.header--dark]="auth.isAuthenticated()">
      <div class="header-inner" [class.header-inner--app]="auth.isAuthenticated()">
        @if (auth.isAuthenticated()) {
          <a class="app-brand" routerLink="/sales" aria-label="Ir para listagem de vendas">
            <span class="app-title">{{ title }}</span>
          </a>
          <nav class="app-nav" aria-label="Navegação principal">
            <a
              routerLink="/sales"
              routerLinkActive="app-tab-active"
              [routerLinkActiveOptions]="{ exact: true }"
              class="app-tab"
              >Lista</a
            >
            <a
              routerLink="/sales/new"
              routerLinkActive="app-tab-active"
              [class.app-tab-active]="saleFormActive()"
              class="app-tab"
              >Nova venda</a
            >
            <a routerLink="/usuarios" routerLinkActive="app-tab-active" class="app-tab">Usuários</a>
          </nav>
          <div class="app-spacer"></div>
          <div class="app-user" aria-label="Usuário logado">
            <span class="app-user-avatar" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path
                  fill="currentColor"
                  d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4.42 0-8 1.79-8 4v2h16v-2c0-2.21-3.58-4-8-4z"
                />
              </svg>
            </span>
            <span class="app-user-name">{{ auth.user()?.name || auth.user()?.email }}</span>
            <span class="app-user-chevron" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path fill="currentColor" d="M7 10l5 5 5-5H7z" />
              </svg>
            </span>
          </div>
          <button
            type="button"
            class="app-btn-sair"
            (click)="auth.logout(); router.navigate(['/login'])"
          >
            Sair
          </button>
        } @else {
          <a class="brand" [routerLink]="'/login'">{{ title }}</a>
          <div class="spacer"></div>
          <div class="user-area">
            <a routerLink="/login" class="btn outline">Entrar</a>
            <a routerLink="/cadastro" class="btn primary">Cadastro</a>
          </div>
        }
      </div>
    </header>
  }
  <main
    class="main"
    [class.main--auth]="authLayout()"
    [class.main--app]="!authLayout() && auth.isAuthenticated()"
  >
    <router-outlet />
  </main>
</div>
